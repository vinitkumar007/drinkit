spring.application.name=drinkit

# Render / Docker give the port in PORT. Locally it is 3000.
server.port=${PORT:3000}
# Behind Render's proxy: use the real client IP (needed for rate limiting).
server.forward-headers-strategy=native

# Database: H2 file database (no install needed). DB_FILE = path without extension.
spring.datasource.url=jdbc:h2:file:${DB_FILE:./data/drinkit};DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=

# Create tables on every start (schema.sql uses CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Static web apps (customer / admin / rider) live in src/main/resources/static
spring.web.resources.cache.cachecontrol.no-cache=true
spring.mvc.contentnegotiation.media-types.webmanifest=application/manifest+json

spring.main.banner-mode=off
