services:
  drinkit:
    build: .
    ports: ["3000:3000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?set STAFF_PASSWORD in .env}
      DEMO_OTP: ${DEMO_OTP:-}
    volumes:
      - drinkit-data:/data
    restart: unless-stopped
volumes:
  drinkit-data:
